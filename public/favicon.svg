<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dark Industrial Background -->
  <rect width="64" height="64" rx="14" fill="#121215"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#2E2E36" stroke-width="1.5"/>
  
  <!-- Subtle CAD grid in icon -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#2E2E36" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#2E2E36" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Anvil / T Structural Monogram -->
  <!-- Top Heavy Anvil Horn & Face (forming the top bar of the T) -->
  <path d="M14 20 L50 20 L48 27 L38 27 L38 46 L44 50 L20 50 L26 46 L26 27 L16 27 Z" 
        fill="#F4F4F5" 
        stroke="#121215" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>
  
  <!-- Left Anvil Beak Accent -->
  <path d="M14 20 C10 20 8 22 10 24 L16 27 Z" fill="#E4E4E7"/>
  
  <!-- Central Forge Hot Core ("T" inner accent) -->
  <rect x="30" y="27" width="4" height="18" fill="#EA580C" rx="1"/>

  <!-- Forge Spark / Star Burst -->
  <circle cx="48" cy="16" r="3.5" fill="#EA580C"/>
  <polygon points="48,9 50,14 55,16 50,18 48,23 46,18 41,16 46,14" fill="#F97316"/>
  <circle cx="48" cy="16" r="1.5" fill="#FFFFFF"/>
</svg>
